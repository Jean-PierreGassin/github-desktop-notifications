name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./scripts/build.sh release MARKETING_VERSION=${{ steps.version.outputs.number }}

      - name: Package
        run: |
          ditto -c -k --keepParent \
            "build/Build/Products/Release/GitHub Notifications.app" \
            GitHubNotifications-${{ steps.version.outputs.number }}.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "GitHubNotifications-${{ steps.version.outputs.number }}.zip" \
            --title "${GITHUB_REF_NAME}" \
            --notes "The app is ad-hoc signed and not notarised. After unzipping, open it once with right-click → Open, or run \`xattr -d com.apple.quarantine GitHubNotifications.app\`."
