name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    # Pinned for the same reason as the release build: a 26.0 deployment target
    # needs the macOS 26 SDK.
    runs-on: macos-26

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install ShellCheck
        run: brew install shellcheck

      - name: Check scripts
        run: shellcheck -x -P scripts scripts/*.sh

      # Ad-hoc signed. The signing certificate only matters for a build people
      # install, and the suite never reads the keychain.
      - name: Test
        run: ./scripts/test.sh
